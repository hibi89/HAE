[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-app"
dynamic = ["version"]
description = "Bounded, read-only JavaScript and TypeScript source analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rea-app = "rea_app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rea_app.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["rea_app"]

[tool.setuptools.package-data]
rea_app = ["babel_parser_adapter.cjs", "package.json", "package-lock.json"]
