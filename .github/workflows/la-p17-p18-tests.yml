name: LA P17-P18 isolated synthetic regression
on:
  push:
    branches:
      - feature/la-p17-audit-evidence-20261112
    paths:
      - 'packages/lightning-azent/**'
      - 'apps/ax-flow/**'
      - '.github/workflows/la-p17-p18-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: la-p17-p18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  la-local-synthetic:
    name: LA synthetic / ${{ matrix.os }} / Py3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact checked out source
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short
      - name: Compile LA + HAE sources without writing tracked files
        run: python -B -m compileall -q packages/lightning-azent apps/ax-flow/axflow
      - name: Full original + P17/P18 Lightning Azent Python regression
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/lightning-azent${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/apps/ax-flow
        run: python -B -m unittest discover -s packages/lightning-azent/tests -v
      - name: Focused SQLite backup source mutation regression
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/ax-flow${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/packages/lightning-azent
        run: python -B -m unittest discover -s apps/ax-flow/tests -p test_engine.py -k backup_discards_snapshot_when_source_changes_before_publish -v
      - name: Original HAE axflow regression
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/ax-flow${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/packages/lightning-azent
        run: python -B -m unittest discover -s apps/ax-flow/tests -v
      - name: Build new-only deterministic synthetic LA zipapp
        shell: bash
        run: |
          mkdir -p dist
          python -B packages/lightning-azent/build_portable_p18.py --output dist/Lightning-Azent-0.1.0-synthetic-dev.pyz
          python -B packages/lightning-azent/verify_portable_p18.py --archive dist/Lightning-Azent-0.1.0-synthetic-dev.pyz --sha256-file dist/Lightning-Azent-0.1.0-synthetic-dev.pyz.sha256
          python -I -B dist/Lightning-Azent-0.1.0-synthetic-dev.pyz capabilities
