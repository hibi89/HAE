name: LA P17-P18 Windows focused backup diagnostics
on:
  push:
    branches: [feature/la-p17-audit-evidence-20261112]
    paths:
      - 'apps/ax-flow/tests/test_engine.py'
      - '.github/workflows/la-p17-p18-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: la-p17-p18-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-backup-focused:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print feature SHA
        run: git rev-parse HEAD
      - name: Verify Windows backup mutation and no-clobber
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/ax-flow
        run: python -B -m unittest discover -s apps/ax-flow/tests -p test_engine.py -k backup_discards_snapshot_when_source_changes_before_publish -v
