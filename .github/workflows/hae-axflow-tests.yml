name: HAE AX Flow regression
on:
  push:
    branches: [feature/axflow-mvp]
    paths:
      - 'apps/ax-flow/**'
      - '.github/workflows/hae-axflow-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify UI races in Node
        working-directory: apps/ax-flow
        run: node tests/test_ui_races.cjs
      - name: Checkout Lightning Azent development branch
        uses: actions/checkout@v4
        with:
          ref: feature/lightning-azent
          path: la-source
      - name: Stage Lightning Azent package for integration
        shell: bash
        run: |
          mkdir -p packages
          cp -R la-source/packages/lightning-azent packages/lightning-azent
      - name: Require Lightning Azent source (no skipped integration)
        shell: bash
        run: |
          test -f packages/lightning-azent/lightning_azent/__init__.py || { echo 'Lightning Azent package missing: cannot validate integration'; exit 1; }
      - name: Verify real six-stage HAE to LA to SQLite HTTP acceptance
        working-directory: apps/ax-flow
        run: python smoke_http.py
      - name: Checkout exact public UGREEN FlowPilot HTTP bridge (no private source export)
        uses: actions/checkout@v4
        with:
          repository: hibi89/hibi89-ugreen-nas-hackathon
          ref: 3cab98b6dadf97dcab32b77f8b33ff7dafb2b462
          path: ugreen-source
          persist-credentials: false
      - name: Verify pinned public bridge commit identity
        shell: bash
        run: |
          test "$(git -C ugreen-source rev-parse HEAD)" = "3cab98b6dadf97dcab32b77f8b33ff7dafb2b462"
      - name: Real FlowPilot to HAE to Lightning Azent SQLite and audit E2E (private)
        working-directory: apps/ax-flow
        env:
          UGREEN_BRIDGE_ROOT: ${{ github.workspace }}/ugreen-source/tools
        run: python -m unittest discover -s tests -p test_ugreen_flowpilot_external_bridge.py -v
      - name: Verify real HAE to Lightning Azent HTTP integration
        working-directory: apps/ax-flow
        run: python -m unittest discover -s tests -p test_la_adapter.py -v
      - name: Smoke Windows integrated launcher against real LA backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/ax-flow/run-integrated.ps1 -LaCheckout ./la-source -Smoke
      - name: Build and smoke offline Windows bundle via double-click entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/build_hae_windows_bundle.py --la-package packages/lightning-azent --output-dir HAE-Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c .\HAE-Windows\run-bundled.cmd --smoke --port 18473 --data-dir "$env:RUNNER_TEMP\HAE Bundle Smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c .\HAE-Windows\run-bundled.cmd --verify --data-dir "$env:RUNNER_TEMP\Must Not Be Created"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "$env:RUNNER_TEMP\Must Not Be Created") { throw 'Bundled verification modified user data' }
      - name: Verify synthetic end-to-end Python suite
        working-directory: apps/ax-flow
        run: python -m unittest discover -s tests -v
      - name: Certify self-contained Windows distribution (no repository dependency)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c .\\HAE-Windows\\VERIFY-WINDOWS.cmd --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require native Windows LA and NTFS acceptance (no skipped gates)
        if: runner.os == 'Windows'
        working-directory: apps/ax-flow
        run: python windows_acceptance.py
      - name: Publish offline Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HAE-Windows-offline
          path: HAE-Windows/
          if-no-files-found: error
