name: HAE PRIVATE pinned-source UGREEN-LA-SOVIA synthetic E2E

on:
  push:
    branches:
      - verify/ugreen-la-bridge-20261030
    paths:
      - ".github/workflows/verify-ugreen-la-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-private-e2e:
    name: Actual private HAE LA + public SOVIA + public UGREEN (no NAS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact private HAE LA source inside private runner
        uses: actions/checkout@v4
        with:
          repository: hibi89/HAE
          ref: 9cba6424dadf3fadb0ccd6ed10040e322c4a62fa
          path: hae
          persist-credentials: false

      - name: Checkout exact public UGREEN verifier
        uses: actions/checkout@v4
        with:
          repository: hibi89/hibi89-ugreen-nas-hackathon
          ref: d99441559caa638e947bbc0d5a79cb9cffed02bb
          path: ugreen
          persist-credentials: false

      - name: Checkout exact public SOVIA advisory engine
        uses: actions/checkout@v4
        with:
          repository: hibi89/SOVIA_sovereign
          ref: 7418b23aff9b3abbd3faf5d1477e7244ec82b681
          path: sovia
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate both pins and run actual HAE local-only synthetic E2E
        working-directory: ugreen
        run: |
          python tools/verify_private_hae_chain.py \
            --hae-root ../hae \
            --sovia-root ../sovia > "$RUNNER_TEMP/ugreen-private-synthetic-proof.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "ugreen-private-synthetic-proof.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["result"] == "PASS"
          assert report["proof_type"] == "REAL_HAE_LA_AND_SOVIA_SYNTHETIC_LOCAL_ONLY"
          assert report["real_la_synthetic_sqlite"] == "PASS"
          assert report["real_la_approved_write_rows"] == 1
          assert report["real_la_replay_duplicate_writes"] == 0
          assert report["real_sovia_advisory"] == "PASS"
          assert report["scenario_count"] == 4
          assert report["actual_nas_verified"] is False
          assert report["registered_uliya_expert_invoked"] is False
          assert report["release_gate"] == "HOLD"
          print("PASS: private pinned LA source + actual local SQLite + pinned SOVIA advisory")
          print("NAS/ULIYA: NOT_TESTED; owner data: NOT_USED; official submission: HOLD")
          PY

      - name: Store hash-only synthetic proof in private HAE artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-hae-la-ugreen-synthetic-e2e
          path: ${{ runner.temp }}/ugreen-private-synthetic-proof.json
          retention-days: 7
          if-no-files-found: error
